name: ci

on:
  push:

permissions:
  contents: read

# A newer push to a branch cancels its older run, test and deploy together, so an older build never goes live after a newer one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # react, react-dom and three ship to every visitor; a known high or critical advisory stops the deploy.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e --project=chromium
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
      # The deploy job uploads this exact build, so the live site only gets what the tests passed.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=isfar --branch=${{ github.ref_name }}
      - name: smoke
        env:
          URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        # A new deployment can answer 522 for a few seconds before Cloudflare serves it.
        run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "$URL" | grep -q "<title>Isfar</title>"
          echo "smoke: $URL ok"
